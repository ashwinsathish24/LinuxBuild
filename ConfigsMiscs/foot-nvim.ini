include=~/.config/foot/foot.ini

[main]
pad=0x0
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.78

[colors-light]
alpha=0.78

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
