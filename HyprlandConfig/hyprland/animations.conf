animations {
    enabled = true

    # Extremely sharp curves (instant accel/decel)
    bezier = specialWorkSwitch, 0.2, 1, 0.3, 1
    bezier = emphasizedAccel, 0.6, 0, 1, 1
    bezier = emphasizedDecel, 0, 1, 0.3, 1
    bezier = standard, 0.4, 0, 1, 1

    # Ultra-fast durations (minimum practical)
    animation = layersIn, 1, 1, emphasizedDecel, slide
    animation = layersOut, 1, 1, emphasizedAccel, slide
    animation = fadeLayers, 1, 1, standard

    animation = windowsIn, 1, 1, emphasizedDecel
    animation = windowsOut, 1, 1, emphasizedAccel
    animation = windowsMove, 1, 1, standard
    animation = workspaces, 1, 1, standard

    animation = specialWorkspace, 1, 1, specialWorkSwitch, slidefadevert 5%

    animation = fade, 1, 1, standard
    animation = fadeDim, 1, 1, standard
    animation = border, 1, 1, standard
}
